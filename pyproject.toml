[tool.ruff.lint.per-file-ignores]
# Steps añaden el raíz del proyecto a sys.path antes de importar `src.*` (Databricks / exec sin __file__).
"src/steps/**/*.py" = ["E402"]
# `dbutils` lo inyecta el runtime de Databricks; no existe en análisis estático local.
"src/libraries/setup_libraries.py" = ["F821"]
