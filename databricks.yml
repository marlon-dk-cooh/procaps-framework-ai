bundle:
  name: procaps-framework-ai

# include:
#   - resources/indexing_workflow.yml

sync:
  include:
    - databricks.yml
    - resources/**
    - config/**
    - src/**
    - requirements.txt

variables:
  existing_cluster_id:
    description: ""
    default: "0330-135329-abkt38v6"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: "https://adb-7020982738702124.4.azuredatabricks.net"
      root_path: /Users/${workspace.current_user.userName}/bundles/${bundle.name}
    run_as:
      user_name: "marlon.marin@dataknow.co"
    variables:
      existing_cluster_id: "0330-135329-abkt38v6"

resources:
  jobs:
    index_workflow_job:
      name: "Procaps automatic indexing workflow [${bundle.target}]"

      tasks:
        - task_key: s00_load_files
          existing_cluster_id: ${var.existing_cluster_id}
          libraries: &common_libraries
            - pypi:
                package: "aiohttp>=3.13.3"
            - pypi:
                package: "azure-ai-documentintelligence>=1.0.2"
            - pypi:
                package: "azure-identity>=1.25.3"
            - pypi:
                package: "python-dotenv>=1.0.0"
            - pypi:
                package: "numpy>=2.4.3"
            - pypi:
                package: "pydantic-settings>=2.13.1"
            - pypi:
                package: "pypdf>=5.0.0"
          notebook_task:
            notebook_path: "./src/steps/s00_load_files.py"

        - task_key: s01_extract_ocr
          existing_cluster_id: ${var.existing_cluster_id}
          depends_on:
            - task_key: s00_load_files
          libraries: *common_libraries
          notebook_task:
            notebook_path: "./src/steps/s01_extract_ocr.py"

        - task_key: s02_structured_data_processing
          existing_cluster_id: ${var.existing_cluster_id}
          depends_on:
            - task_key: s01_extract_ocr
          notebook_task:
            notebook_path: "./src/steps/s02_structured_data_processing.py"
