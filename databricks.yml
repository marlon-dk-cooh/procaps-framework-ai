bundle:
  # Nombre lógico del bundle para este workflow asíncrono
  name: procaps-framework-ai

include:
# Workflows-> resources/
  - resources/indexing_workflow.yml
  # - resources/sharepoint_workflow.yml # Not required at the moment.

sync:
  include:
    - databricks.yml
    - resources/**
    - config/**
    - src/**
  exclude:
    - .databricks/**
    - .venv/**
    - "**/__pycache__/**"
    - "**/*.pyc"

variables:
  business_domain:
    description: "Área de negocio dueña del producto (ej: Financiero, Salud, CX)"
    default: "General"

  # Variables para benchmark y optimización (usadas en job_clusters)
  node_type_id:
    description: "Tipo de nodo Azure para clusters efímeros"
    default: "Standard_D2ds_v6"

  num_workers:
    description: "Número de workers (0-2 para inferencia)"
    default: 1

  availability:
    description: "Tipo de instancias (SPOT_WITH_FALLBACK_AZURE para ahorro)"
    default: "SPOT_WITH_FALLBACK_AZURE"

  autotermination_minutes:
    description: "Minutos para auto-apagado del cluster efímero"
    default: 10

  spark_version:
    description: "Versión de Spark de Databricks Runtime"
    default: "17.3.x-scala2.13"

targets:
  dev:
    mode: development
    default: true
    workspace:
      # TODO: reemplazar por el host de tu workspace https://<tu-workspace>.azuredatabricks.net/
      host: https://adb-7020982738702124.4.azuredatabricks.net/
      # TODO: ruta donde se sincronizará el bundle en el workspace /Users/<tu-usuario>/bundles/workflow-template
      root_path: /Users/marlon.marin@dataknow.co/bundles/procaps-framework-ai

    variables:
      availability: "ON_DEMAND_AZURE"
      node_type_id: "Standard_D4ds_v5"
      num_workers: 1
      autotermination_minutes: 5
      spark_version: "17.3.x-scala2.13"

    resources:
    # Para nuevo caso, agregar job_clusters para el nuevo caso en el target correspondiente.
      jobs:
        indexing_workflow_job:
          job_clusters:
            - job_cluster_key: "cluster_dedicado"
              new_cluster:
                spark_version: "${var.spark_version}"
                azure_attributes:
                  first_on_demand: 2
                  availability: "${var.availability}"
                  spot_bid_max_price: 100
                node_type_id: "${var.node_type_id}"
                driver_node_type_id: "${var.node_type_id}"
                num_workers: "${var.num_workers}"
                autotermination_minutes: "${var.autotermination_minutes}"
                data_security_mode: SINGLE_USER
                runtime_engine: STANDARD
                spark_conf:
                  "spark.databricks.delta.preview.enabled": "true"
                  "spark.databricks.delta.optimizeWrite.enabled": "true"
                  "spark.sql.adaptive.enabled": "true"
                spark_env_vars:
                  PIP_INDEX_URL: "https://pypi.org/simple"
                custom_tags:
                  project: "Framework-IA"
                  environment: "${bundle.target}"
                  business_domain: "${var.business_domain}"
                  instance_type: "ephemeral"

